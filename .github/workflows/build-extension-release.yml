name: Build Extension Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-extension-release.yml"
      - "Extension/**"
      - "Universal/**"
      - "Pinyin/**"
      - "Server/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-extension-release.yml"
      - "Extension/**"
      - "Universal/**"
      - "Pinyin/**"
      - "Server/**"

permissions:
  contents: write

concurrency:
  group: build-extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build release bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Stub Spicetify for CI build
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/spicetify" <<'SH'
          #!/usr/bin/env sh
          if [ "$1" = "-c" ]; then
            echo "$RUNNER_TEMP/spicetify/config-xpui.ini"
            exit 0
          fi

          echo "spicetify stub only supports -c during CI builds" >&2
          exit 1
          SH
          chmod +x "$RUNNER_TEMP/bin/spicetify"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build release bundle
        working-directory: Extension
        run: deno task release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test loader
        run: node --test Extension/Tests/*.test.mjs

      - name: Test Worker
        working-directory: Server
        run: |
          npm ci
          npm test
          npm run typecheck
          npx wrangler deploy --dry-run

      - name: Commit release bundle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git add Extension/Builds/Release
          if git diff --cached --quiet; then
            echo "Release bundle is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: update extension release bundle"
          git push

      - name: Publish Worker and immutable release assets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: Server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to publish the update pointer and assets."
            exit 1
          fi
          npx wrangler deploy

      - name: Verify published release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node Extension/Tasks/VerifyPublishedRelease.mjs
