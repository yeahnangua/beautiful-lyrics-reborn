name: Build Extension Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-extension-release.yml"
      - "Extension/**"
      - "Universal/**"
      - "Server/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-extension-release.yml"
      - "Extension/**"
      - "Universal/**"
      - "Server/**"

permissions:
  contents: write

concurrency:
  group: build-extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build release bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Extension/Folia/package-lock.json

      - name: Install Folia build dependencies
        working-directory: Extension/Folia
        run: npm ci

      - name: Build release bundle
        working-directory: Extension
        run: |
          node Tasks/PrepareRelease.mjs
          deno task release

      - name: Remove old release bundles
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/releases; then
            RELEASE_HISTORY_REF=origin/releases node Extension/Tasks/PruneRelease.mjs
          else
            node Extension/Tasks/PruneRelease.mjs
          fi

      - name: Typecheck extension
        working-directory: Extension
        run: deno check Source/main.ts Source/Modules/FullscreenRuntimeOnline.ts Spices/Build/Bundle.ts Tasks/*.ts

      - name: Test extension runtime and loader
        run: |
          node --test Extension/Tests/*.test.mjs
          cd Extension
          deno test --allow-read --allow-write Tests/DebugServer.test.ts

      - name: Typecheck and test Folia visualizers
        working-directory: Extension/Folia
        run: |
          npm run typecheck
          npx playwright install --with-deps chromium
          npm run test:ui

      - name: Test Worker
        working-directory: Server
        run: |
          npm ci
          npm test
          npm run typecheck
          npx wrangler deploy --dry-run

      - name: Check lyrics authentication before publishing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: Server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LYRICS_AUTH_COMPATIBILITY_VERIFIED: ${{ vars.LYRICS_AUTH_COMPATIBILITY_VERIFIED }}
        run: node Tasks/CheckLyricsAuth.mjs

      - name: Stage, verify and publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FEEDBACK_DATABASE_ID: ${{ secrets.FEEDBACK_DATABASE_ID }}
          LYRICS_AUTH_COMPATIBILITY_VERIFIED: ${{ vars.LYRICS_AUTH_COMPATIBILITY_VERIFIED }}
        run: node Extension/Tasks/PublishRelease.mjs
