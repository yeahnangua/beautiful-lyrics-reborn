name = "beautiful-lyrics-reborn-server"
main = "src/index.ts"
compatibility_date = "2026-05-22"

[[routes]]
pattern = "lyrics.txw.qzz.io"
custom_domain = true

[[analytics_engine_datasets]]
binding = "STATS"
dataset = "lyrics_outcomes"

[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "lyrics_metrics"

[[ratelimits]]
name = "METRICS_LIMITER"
namespace_id = "823601"
simple = { limit = 120, period = 60 }

# Authenticated lyrics access. Keep these namespaces separate from telemetry.
[[ratelimits]]
name = "LYRICS_SESSION_LIMITER"
namespace_id = "823602"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "LYRICS_TOKEN_LIMITER"
namespace_id = "823603"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "LYRICS_IP_LIMITER"
namespace_id = "823606"
simple = { limit = 300, period = 60 }

# Required, independent signing secret (at least 32 random bytes):
# wrangler secret put LYRICS_SESSION_SECRET

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false

[assets]
directory = "../Extension/Builds/Release"
binding = "RELEASE_ASSETS"
run_worker_first = true

# Replace this local placeholder with the D1 UUID, or supply FEEDBACK_DATABASE_ID to Tasks/Deploy.mjs.
[[d1_databases]]
binding = "FEEDBACK_DB"
database_name = "beautiful-lyrics-feedback"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Dedicated lyrics database. Tasks/Deploy.mjs resolves its UUID by name when unset.
[[d1_databases]]
binding = "LYRICS_CACHE_DB"
database_name = "lyrics-cache"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "cache-migrations"

# Spicy Lyrics provider key (secret). Set it with: `wrangler secret put SPICY_LYRICS_KEY`.
# The provider is skipped when this is unset, so an empty secret is a safe no-op.
# Get a key at https://developers.spicylyrics.org/dashboard/applications (choose a secret key).

[triggers]
crons = ["15 19 * * *"]
