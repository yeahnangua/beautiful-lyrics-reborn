name = "beautiful-lyrics-reborn-server"
main = "src/index.ts"
compatibility_date = "2026-05-22"

[[routes]]
pattern = "lyrics.txw.qzz.io"
custom_domain = true

[[analytics_engine_datasets]]
binding = "STATS"
dataset = "lyrics_outcomes"

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false

[assets]
directory = "../Extension/Builds/Release"
binding = "RELEASE_ASSETS"
run_worker_first = true

# Replace this local placeholder with the D1 UUID, or supply FEEDBACK_DATABASE_ID to Tasks/Deploy.mjs.
[[d1_databases]]
binding = "FEEDBACK_DB"
database_name = "beautiful-lyrics-feedback"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["15 19 * * *"]
